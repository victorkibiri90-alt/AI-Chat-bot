<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="logo.png">
<title>PENTAGON BOT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENTAGON CHATBOT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chatcontainer">
            <header style="background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 15px; padding: 12px 20px; border-bottom: 2px solid #d4af37;">
  <img src="logo.png" alt="Pentagon Bot Logo" style="height: 62px; width: auto; margin-right: 15px;">
  <h1 style="color: #d4c21e; margin: 0; font-size: 26px; letter-spacing: 2px; font-family: Arial, sans-serif;">PENTAGON BOT</h1>
</header>
        <div id="chat-box" class="chat-box">
            <div class="message bot-message">My name is PENTAGON BOT. How can I assist you today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button id="send-button">Send</button>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
