<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENTAGON AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chatcontainer">
        <header>
          <div style="display:flex; align-items:center; gap:12px;">
            <button id="menuBtn" class="hamburger" onclick="toggleMenu()">
              <span></span><span></span><span></span>
            </button>
            <img src="/logo.png" alt="logo" class="logo-img">
            <div class="logo">PENTAGON AI</div>
          </div>
        </header>

        <div id="sideMenu" class="side-menu">
          <a href="#" onclick="newChat(); toggleMenu();">+ New Chat</a>
          <a href="#" onclick="showHistory(); toggleMenu();">History</a>
          <a href="#" onclick="clearChat(); toggleMenu();">Clear Chat</a>
          <a href="#" onclick="showSettings(); toggleMenu();">Settings</a>
          <a href="#" id="menuAuthBtn" onclick="handleMenuAuth()" style="border-top:1px solid #C5A059; margin-top:10px; font-weight:bold;">Login</a>
        </div>
        <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

        <div id="chat-box" class="chat-box">
            <div class="message bot-message">My name is PENTAGON BOT. How can I assist you today?</div>
        </div>

        <div id="preview-area">
          <div style="position:relative; display:inline-block;">
            <img id="preview-img" src="">
            <button id="remove-preview">×</button>
            <div id="preview-name"></div>
          </div>
        </div>

        <div class="input-area">
          <button id="plus-btn" type="button">+</button>
          <div id="plus-menu">
            <div id="opt-camera">📷 Camera</div>
            <div id="opt-gallery">🖼️ Photo & Video</div>
            <div id="opt-file">📁 File</div>
          </div>
          <input type="text" id="user-input" placeholder="Type your message...">
<button id="mic-btn" type="button" style="background:#1a1a1a; border:1px solid #d4af37; width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; margin:0 5px;">
  <span style="display:flex; gap:2px; align-items:end;">
    <span style="width:3px; height:6px; background:#d4af37; border-radius:2px; display:block;"></span>
    <span style="width:3px; height:12px; background:#d4af37; border-radius:2px; display:block;"></span>
    <span style="width:3px; height:6px; background:#d4af37; border-radius:2px; display:block;"></span>
  </span>
</button>
<button id="send-button">Send</button>
          <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
          <input type="file" id="gallery-input" accept="image/*,video/*" style="display:none">
          <input type="file" id="file-input" style="display:none">
        </div>
    </div>

    <div id="authModal"><div>
      <h3 id="authTitle">Login</h3>
      <input id="a-user" placeholder="Username"><input id="a-pass" type="password" placeholder="Password">
      <button onclick="doAuth()" class="go-btn">GO</button>
      <p id="a-toggle" onclick="toggleMode()">No account? Register</p>
      <p id="a-err"></p>
      <button onclick="closeAuth()" class="close-btn">Close - Chat without login</button>
    </div></div>

    <div id="historyModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#1a1a1a; border:1px solid #d4af37; border-radius:12px; width:90%; max-width:400px; max-height:70vh; overflow-y:auto; padding:0;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #333; position:sticky; top:0; background:#1a1a1a;">
      <h3 style="color:#d4af37; margin:0;">Chat History</h3>
      <button onclick="closeHistory()" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">×</button>
    </div>
    <div id="historyList" style="padding:10px;"></div>
  </div>
</div>

    <script src="script.js"></script>



</body>
</html>
